<!doctype html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FloraHub — Criar conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f4f7f2', 100: '#e6ede0', 200: '#cddcc2', 300: '#aac29b',
                            400: '#82a271', 500: '#5f8350', 600: '#4a6b3d', 700: '#3c5632',
                            800: '#32462b', 900: '#2b3b25', 950: '#16200f',
                        },
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-stone-50 font-sans text-stone-800 antialiased">

    <div class="grid min-h-screen lg:grid-cols-2">

        <!-- Decorative panel -->
        <div class="relative hidden flex-col justify-between overflow-hidden bg-brand-800 p-12 text-brand-50 lg:flex">
            <a href="home.html" class="relative flex items-center gap-2">
                <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-white/10 text-white ring-1 ring-inset ring-white/20">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21C7 21 3 17 3 11.5 3 6 7.5 3 12 3c1 4 5 5.5 5 10.5S15 21 12 21Z"/></svg>
                </span>
                <span class="text-lg font-semibold tracking-tight text-white">FloraHub</span>
            </a>

            <div class="relative max-w-sm">
                <p class="text-2xl font-medium leading-relaxed text-white">
                    "Da primeira estaca à floração plena — mantenha um registo do percurso de cada planta."
                </p>
                <p class="mt-4 text-sm text-brand-200">Junte-se ao FloraHub gratuitamente.</p>
            </div>

            <p class="relative text-xs text-brand-300">© 2026 FloraHub — projeto educativo.</p>
        </div>

        <!-- Form panel -->
        <div class="flex flex-col justify-center px-6 py-12 sm:px-12 lg:px-16">
            <div class="mx-auto w-full max-w-sm">
                <a href="home.html" class="mb-10 flex items-center gap-2 lg:hidden">
                    <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-brand-600 text-white">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21C7 21 3 17 3 11.5 3 6 7.5 3 12 3c1 4 5 5.5 5 10.5S15 21 12 21Z"/></svg>
                    </span>
                    <span class="text-lg font-semibold tracking-tight text-stone-900">FloraHub</span>
                </a>

                <h1 class="text-2xl font-semibold tracking-tight text-stone-900">Crie a sua conta</h1>
                <p class="mt-1.5 text-sm text-stone-500">Comece hoje a acompanhar a sua coleção de plantas.</p>

                <form class="mt-8 space-y-5">
                    <div>
                        <label for="name" class="mb-1.5 block text-sm font-medium text-stone-700">Nome</label>
                        <input id="name" type="text" placeholder="Sofia Almeida" class="w-full rounded-lg border border-stone-300 bg-white px-3.5 py-2.5 text-sm text-stone-900 placeholder:text-stone-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20" />
                    </div>

                    <div>
                        <label for="email" class="mb-1.5 block text-sm font-medium text-stone-700">Email</label>
                        <input id="email" type="email" placeholder="voce@exemplo.com" class="w-full rounded-lg border border-stone-300 bg-white px-3.5 py-2.5 text-sm text-stone-900 placeholder:text-stone-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20" />
                    </div>

                    <div>
                        <label for="password" class="mb-1.5 block text-sm font-medium text-stone-700">Palavra-passe</label>
                        <input id="password" type="password" placeholder="••••••••" class="w-full rounded-lg border border-stone-300 bg-white px-3.5 py-2.5 text-sm text-stone-900 placeholder:text-stone-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20" />
                    </div>

                    <div>
                        <label for="password_confirmation" class="mb-1.5 block text-sm font-medium text-stone-700">Confirmar palavra-passe</label>
                        <input id="password_confirmation" type="password" placeholder="••••••••" class="w-full rounded-lg border border-stone-300 bg-white px-3.5 py-2.5 text-sm text-stone-900 placeholder:text-stone-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20" />
                    </div>

                    <button type="submit" class="w-full rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700">
                        Criar conta
                    </button>
                </form>

                <p class="mt-6 text-center text-sm text-stone-500">
                    Já tem conta?
                    <a href="login.html" class="font-medium text-brand-700 hover:text-brand-800">Iniciar sessão</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
